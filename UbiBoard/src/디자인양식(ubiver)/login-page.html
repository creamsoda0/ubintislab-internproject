<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 | UBINTISLAB</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    /* --- CSS 시작 --- */
    
    /* 초기화 및 공통 스타일 */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Noto Sans KR', sans-serif;
        background-color: #f0f2f5; /* 전체 배경색 (밝은 회색) */
        display: flex;
        justify-content: center; /* 가로 중앙 정렬 */
        align-items: center; /* 세로 중앙 정렬 */
        min-height: 100vh; /* 화면 전체 높이 사용 */
        color: #333;
    }

    /* 로그인 컨테이너 (카드와 카피라이트를 감싸는 영역) */
    .login-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 440px; /* 카드의 최대 너비 */
        padding: 20px;
    }

    /* 로그인 카드 스타일 */
    .login-card {
        background-color: #ffffff;
        border-radius: 12px; /* 둥근 모서리 */
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); /* 부드러운 그림자 효과 */
        overflow: hidden; /* 자식 요소가 둥근 모서리를 벗어나지 않도록 */
        width: 100%;
    }

    /* 카드 상단 짙은 남색 띠 */
    .card-header-bar {
        height: 10px;
        background-color: #1a365d; /* 짙은 남색 */
    }

    /* 카드 내부 콘텐츠 영역 */
    .card-body {
        padding: 40px 30px 30px; /* 내부 여백 설정 */
    }

    /* 로고 및 환영 문구 영역 */
    .logo-section {
        text-align: center;
        margin-bottom: 35px;
    }

    .logo-section h1 {
        color: #1a365d; /* 로고 색상 (짙은 남색) */
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 10px;
    }

    .logo-section p {
        color: #666; /* 환영 문구 색상 (회색) */
        font-size: 14px;
    }

    /* 입력 필드 그룹 (라벨 + 입력창) */
    .input-group {
        margin-bottom: 20px;
    }

    .input-group label {
        display: block;
        font-weight: 500;
        margin-bottom: 8px;
        font-size: 14px;
        color: #333;
    }

    .input-group input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid #ddd; /* 테두리 색상 */
        border-radius: 8px; /* 입력창 둥근 모서리 */
        font-size: 14px;
        outline: none; /* 포커스 시 기본 아웃라인 제거 */
        transition: border-color 0.3s; /* 부드러운 색상 변경 효과 */
    }

    /* 입력창 포커스 시 테두리 색상 변경 */
    .input-group input:focus {
        border-color: #1a365d;
    }

    /* 플레이스홀더 색상 */
    .input-group input::placeholder {
        color: #999;
    }

    /* 로그인 버튼 스타일 */
    .login-btn {
        width: 100%;
        padding: 16px;
        background-color: #1a365d; /* 버튼 배경색 (짙은 남색) */
        color: white;
        border: none;
        border-radius: 8px; /* 버튼 둥근 모서리 */
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 0.3s, box-shadow 0.3s;
        margin-top: 10px;
        box-shadow: 0 4px 6px rgba(26, 54, 93, 0.2); /* 버튼 그림자 */
    }

    /* 로그인 버튼 호버 효과 */
    .login-btn:hover {
        background-color: #132c4e; /* 호버 시 조금 더 어두운 색상 */
        box-shadow: 0 6px 8px rgba(26, 54, 93, 0.3);
    }

    /* 하단 링크 영역 (회원가입, 아이디찾기 등) */
    .links {
        margin-top: 25px;
        text-align: center;
        font-size: 13px;
        color: #888;
    }

    .links a {
        color: #888;
        text-decoration: none; /* 밑줄 제거 */
        margin: 0 5px;
        transition: color 0.3s;
    }

    .links a:hover {
        color: #1a365d; /* 호버 시 색상 변경 */
    }

    /* 링크 사이 구분선 (|) */
    .links .divider {
        color: #ccc;
        font-size: 11px;
        vertical-align: middle;
    }

    /* 페이지 하단 카피라이트 */
    .footer-copy {
        margin-top: 30px;
        font-size: 12px;
        color: #999;
        text-align: center;
    }

    /* --- CSS 끝 --- */
</style>
</head>
<body>

    <div class="login-container">
        
        <div class="login-card">
            <div class="card-header-bar"></div>
            
            <div class="card-body">
                <div class="logo-section">
                    <h1>UBINTISLAB</h1>
                    <p>유비앤티스랩 서비스 이용을 환영합니다.</p>
                </div>

                <form onsubmit="return false;">
                    <div class="input-group">
                        <label for="userId">아이디</label>
                        <input type="text" id="userId" placeholder="아이디를 입력하세요" autocomplete="off">
                    </div>

                    <div class="input-group">
                        <label for="password">비밀번호</label>
                        <input type="password" id="password" placeholder="비밀번호를 입력하세요">
                    </div>

                    <button type="submit" class="login-btn">로그인</button>
                </form>

                <div class="links">
                    <a href="#">회원가입</a>
                    <span class="divider">|</span>
                    <a href="#">아이디 찾기</a>
                    <span class="divider">|</span>
                    <a href="#">비밀번호 재발급</a>
                </div>
            </div>
        </div>

        <div class="footer-copy">
            © 2025 UBNTIS LAB Corp. All Rights Reserved.
        </div>
    </div>

</body>
</html>
