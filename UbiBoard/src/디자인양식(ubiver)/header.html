<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>헤더 디자인 확인 | 유비앤티스랩</title>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>
/* =========================================
   헤더 전용 스타일 (Modern Red Cross Theme)
   ========================================= */

/* 초기화 */
.rc-header ul, .rc-header li { list-style: none; margin: 0; padding: 0; }
.rc-header a { text-decoration: none; color: inherit; }

.rc-header {
    width: 100%;
    background-color: #fff;
    border-bottom: 1px solid #ddd;
    font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
    position: relative;
    z-index: 1000;
}

/* 1. 상단 유틸리티 바 (로그인/회원가입 등) */
.utility-bar {
    background-color: #f8f9fa; /* 아주 연한 회색 배경 */
    border-bottom: 1px solid #eee;
    height: 40px;
    display: flex;
    align-items: center;
}

.utility-inner {
    width: 100%;
    max-width: 1200px; /* 게시판 max-width와 통일 */
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    justify-content: flex-end; /* 오른쪽 정렬 */
}

.utility-menu {
    display: flex;
    align-items: center;
    gap: 20px; /* 항목 간 간격 */
    font-size: 13px;
    color: #666;
}

.utility-menu li { display: flex; align-items: center; position: relative; }

/* 구분선 (Pipe) 처리 */
.utility-menu li:not(.no-line):not(:last-child)::after {
    content: "";
    display: block;
    width: 1px;
    height: 10px;
    background: #ccc;
    position: absolute;
    right: -10px;
    top: 50%;
    transform: translateY(-50%);
}
.utility-menu .no-line::after { display: none; }

.utility-menu a:hover { color: #d32f2f; font-weight: 500; } /* 호버 시 적십자 레드 */

/* 2. 로그인 사용자 정보 & 타이머 */
.user-info { font-weight: 600; color: #333; }
.user-id { color: #888; font-weight: 400; font-size: 12px; margin-left: 2px; }

/* 타이머 디자인 */
.timer-wrap {
    display: flex;
    align-items: center;
    background: #fff;
    border: 1px solid #d32f2f;
    border-radius: 12px;
    padding: 2px 10px;
    margin-right: 10px;
}
.timer-text { color: #d32f2f; font-size: 12px; font-weight: bold; margin-right: 5px; }
.btn-extend {
    background: #d32f2f;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 11px;
    padding: 1px 6px;
    cursor: pointer;
    transition: background 0.2s;
}
.btn-extend:hover { background: #b71c1c; }

/* 3. 하단 메인 바 (로고 + 모바일 메뉴) */
.main-bar {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
}

/* 로고 */
.logo a {
    font-size: 24px;
    font-weight: 800;
    color: #d32f2f; /* 적십자 레드 */
    letter-spacing: -0.5px;
}

/* 모바일 햄버거 메뉴 버튼 */
.btn-hamburger {
    display: none; /* PC에서는 숨김 */
    width: 30px; height: 30px;
    position: relative;
    cursor: pointer;
}
.btn-hamburger span {
    display: block; width: 24px; height: 2px; background: #333; position: absolute; left: 3px;
}
.btn-hamburger span:nth-child(1) { top: 6px; }
.btn-hamburger span:nth-child(2) { top: 14px; }
.btn-hamburger span:nth-child(3) { top: 22px; }


/* 반응형 */
@media screen and (max-width: 768px) {
    .utility-bar { display: none; }
    .btn-hamburger { display: block; }
    .main-bar { height: 60px; }
}
</style>
</head>
<body>

<header class="rc-header">
    
    <div class="utility-bar">
        <div class="utility-inner">
            <ul class="utility-menu">
                
                <li class="no-line">
                    <div class="timer-wrap">
                        <span class="timer-text" id="sessionTimer">30:00</span>
                        <button type="button" class="btn-extend" onclick="extendLogin();">연장</button>
                    </div>
                </li>

                <li>
                    <span class="user-info">
                        홍길동
                        <span class="user-id">(admin)</span>
                    </span> 님
                </li>
                
                <li><a href="#">정보수정</a></li>
                <li class="no-line"><a href="#">로그아웃</a></li>
                
                <li><a href="#">관리자 페이지</a></li>

            </ul>
        </div>
    </div>

    <div class="main-bar">
        <h1 class="logo">
            <a href="#">UBINTISLAB</a>
        </h1>

        <a class="btn-hamburger" href="#none">
            <span></span><span></span><span></span>
        </a>
    </div>

</header>

<script>
// [디자인 확인용] 설정값 하드코딩 (30분)
const SESSION_TIMEOUT_SEC = 30 * 60; 
const SESSION_TIMEOUT_MS = SESSION_TIMEOUT_SEC * 1000;
const KEY_LAST_ACTIVE = 'ubintis_lastActiveTime_mock'; // 로컬 테스트용 키

var timerInterval;

const SessionManager = {
    // 현재 시간을 localStorage에 기록 
    updateLastActive: function() {
        localStorage.setItem(KEY_LAST_ACTIVE, Date.now().toString());
    },

    // 저장된 마지막 활동 시간을 가져옴 
    getLastActive: function() {
        const stored = localStorage.getItem(KEY_LAST_ACTIVE);
        return stored ? parseInt(stored) : Date.now();
    }
};

// 타이머 및 화면 표시 함수
function startTimer() {
    // 기존 인터벌 제거
    if (timerInterval) clearInterval(timerInterval);

    timerInterval = setInterval(function() {
        const now = Date.now();
        const lastActive = SessionManager.getLastActive(); 
        
        // 경과 시간 = 현재시간 - 마지막활동시간
        const elapsed = now - lastActive;
        
        // 남은 시간 계산
        const remainingMS = SESSION_TIMEOUT_MS - elapsed;
        
        // 시간이 다 되었을 때
        if (remainingMS <= 0) {
            clearInterval(timerInterval);
            const timerDisplay = document.getElementById('sessionTimer');
            if(timerDisplay) timerDisplay.innerHTML = "0:00";
            
            alert("[디자인 확인용] 세션이 만료되어 로그아웃됩니다.");
            return;
        }

        const remainingSec = Math.ceil(remainingMS / 1000);
        
        const minutes = Math.floor(remainingSec / 60);
        let seconds = remainingSec % 60;
        seconds = seconds < 10 ? '0' + seconds : seconds;

        // 화면에 표시
        const timerDisplay = document.getElementById('sessionTimer');
        if(timerDisplay) {
            timerDisplay.innerHTML = minutes + ":" + seconds;
        }

    }, 1000); // 1초마다 검사
}

// [디자인 확인용] 로그인 연장 버튼
function extendLogin() {
    // 실제 AJAX 요청 대신 성공 처리 흉내
    alert("[디자인 확인용] 로그인 시간이 연장되었습니다.");
    SessionManager.updateLastActive();
    startTimer(); // 타이머 즉시 갱신
}

// 초기화
$(document).ready(function() {
    SessionManager.updateLastActive();
    startTimer();
    
    // Ajax 완료 시 시간 갱신 (테스트용)
    $(document).ajaxComplete(function() {
        SessionManager.updateLastActive();
    });
});
</script>

</body>
</html>
